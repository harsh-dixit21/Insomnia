name: Insomnia checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check evaluation examples
        run: npm run check:examples
      - name: Check invalid-input rejection
        run: npm run check:rejections
      - name: Check workspace backup rejection
        run: npm run check:workspace-rejections
      - name: Check valid workspace compatibility
        run: npm run check:workspace-compatibility
      - name: Check CSV parsing and imports
        run: npm run check:csv
      - run: npm run check:screens
      - run: npm run check:production
