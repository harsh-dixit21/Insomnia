# Optional persistent backend. Render charges for this service and disk.
# Review the plan in Render before creating the Blueprint.
services:
  - type: web
    name: insomnia-backend
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: INSOMNIA_HOST
        value: 0.0.0.0
      - key: INSOMNIA_PORT
        value: 5181
      - key: INSOMNIA_DB
        value: /data/insomnia.sqlite
      - key: INSOMNIA_LOCAL_SERVICES
        value: "false"
      - key: INSOMNIA_LOCAL_SSO
        value: "false"
      - key: INSOMNIA_SECURE_COOKIE
        value: "true"
      - key: INSOMNIA_ORIGIN
        sync: false
    disk:
      name: insomnia-data
      mountPath: /data
      sizeGB: 1
